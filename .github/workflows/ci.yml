name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        java-version: [17]
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build backend services
        run: |
          cd api-gateway && mvn -B -q package || true
          cd ../auth-service && mvn -B -q package || true
          cd ../monitoring-service && mvn -B -q package || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AI service dependencies
        run: |
          cd ai-services
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint placeholder files
        run: |
          echo "CI scaffolding completed"
