server:
  port: 8082

spring:
  application:
    name: monitoring-service
  datasource:
    url: ${MONITORING_DATABASE_URL:jdbc:postgresql://localhost:5432/nexusai_monitoring}
    username: ${MONITORING_DATABASE_USER:nexusai}
    password: ${MONITORING_DATABASE_PASSWORD:nexusai}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
