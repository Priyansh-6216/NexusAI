version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai
      POSTGRES_DB: nexusai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  redis:
    image: redis:7
    ports:
      - 6379:6379

  zookeeper:
    image: confluentinc/cp-zookeeper:8.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181

  kafka:
    image: confluentinc/cp-kafka:8.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - 9092:9092

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333

  frontend:
    build: ./frontend
    ports:
      - 3000:3000
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - 8080:8080
    depends_on:
      - auth-service
      - monitoring-service
      - incident-service
      - code-review-service
      - repo-intelligence-service
      - llm-router-service
      - ai-agent-service
      - postgres
      - redis

  auth-service:
    build: ./auth-service
    ports:
      - 8081:8081
    depends_on:
      - postgres
      - redis

  monitoring-service:
    build: ./monitoring-service
    ports:
      - 8082:8082
    depends_on:
      - postgres
      - kafka

  incident-service:
    build: ./incident-service
    ports:
      - 8083:8083
    depends_on:
      - kafka

  code-review-service:
    build: ./code-review-service
    ports:
      - 8084:8084
    depends_on:
      - kafka
      - ai-services

  repo-intelligence-service:
    build: ./repo-intelligence-service
    ports:
      - 8085:8085
    depends_on:
      - kafka
      - qdrant
      - ai-services

  llm-router-service:
    build: ./llm-router-service
    ports:
      - 8086:8086
    depends_on:
      - kafka
      - redis

  ai-agent-service:
    build: ./ai-agent-service
    ports:
      - 8087:8087
    depends_on:
      - kafka
      - redis
      - ai-services

  ai-services:
    build: ./ai-services
    ports:
      - 8000:8000
    depends_on:
      - qdrant
      - redis

volumes:
  postgres-data:
